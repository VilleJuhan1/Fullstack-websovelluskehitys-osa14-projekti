name: Manual Branch Deploy

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Random Tag
        id: generate-tag
        run: |
          ADJECTIVES=("happy" "brave" "clever" "swift" "obvious" "gentle" "mighty" "shiny")
          ANIMALS=("dolphin" "lion" "eagle" "fox" "whale" "owl" "tiger" "wolf")
          RAND_ADJ=${ADJECTIVES[$RANDOM % ${#ADJECTIVES[@]}]}
          RAND_ANI=${ANIMALS[$RANDOM % ${#ANIMALS[@]}]}
          TAG="${RAND_ADJ}-${RAND_ANI}-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Test Backend
        run: |
          cd App/backend
          # Run linting
          npm install
          npm run lint
          # Build image for ARM64 (OCI Ampere)
          docker build --platform linux/arm64 -t ${{ secrets.DOCKERHUB_USERNAME }}/quiz-backend:${{ steps.generate-tag.outputs.tag }} .

      - name: Build and Test Frontend
        run: |
          cd App/frontend
          npm install
          npm run lint
          
          # Use production/dev secrets for API URL
          if [ "${{ github.event.inputs.target_env }}" == "prod" ]; then
            API_URL="/graphql" # Proxied via Frontend Nginx
            SHOW_DEV_BAR="false"
          else
            API_URL="/graphql" # Proxied via Frontend Nginx
            SHOW_DEV_BAR="true"
          fi

          # Build production image for ARM64 (OCI Ampere)
          docker build \
            --platform linux/arm64 \
            --build-arg VITE_APP_VERSION=${{ steps.generate-tag.outputs.tag }} \
            --build-arg VITE_API_URL="$API_URL" \
            --build-arg VITE_SHOW_DEV_BAR="$SHOW_DEV_BAR" \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/quiz-frontend:${{ steps.generate-tag.outputs.tag }} .

      - name: Push Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/quiz-backend:${{ steps.generate-tag.outputs.tag }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/quiz-frontend:${{ steps.generate-tag.outputs.tag }}

      - name: Update Kustomize Manifests
        run: |
          cd Infrastructure/kubernetes/apps/${{ github.event.inputs.target_env }}
          kustomize edit set image villejuhan1/quiz-backend=${{ secrets.DOCKERHUB_USERNAME }}/quiz-backend:${{ steps.generate-tag.outputs.tag }}
          kustomize edit set image villejuhan1/quiz-frontend=${{ secrets.DOCKERHUB_USERNAME }}/quiz-frontend:${{ steps.generate-tag.outputs.tag }}
          
          # Also update the VITE_APP_VERSION in the patch if dev
          if [ "${{ github.event.inputs.target_env }}" == "dev" ]; then
            # Find the line after 'name: VITE_APP_VERSION' and update its value
            sed -i "/name: VITE_APP_VERSION/{n;s/value: .*/value: ${{ steps.generate-tag.outputs.tag }}/}" kustomization.yaml
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Infrastructure/kubernetes/apps/${{ github.event.inputs.target_env }}/kustomization.yaml
          git commit -m "Deploy ${{ github.event.inputs.target_env }}: ${{ steps.generate-tag.outputs.tag }}"
          git push origin HEAD:${{ github.ref }}
