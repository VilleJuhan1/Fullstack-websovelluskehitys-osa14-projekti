name: Manual Branch Deploy

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.target_env }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Random Tag
        id: generate-tag
        run: |
          ADJECTIVES=("happy" "brave" "clever" "swift" "obvious" "gentle" "mighty" "shiny")
          ANIMALS=("dolphin" "lion" "eagle" "fox" "whale" "owl" "tiger" "wolf")
          RAND_ADJ=${ADJECTIVES[$RANDOM % ${#ADJECTIVES[@]}]}
          RAND_ANI=${ANIMALS[$RANDOM % ${#ANIMALS[@]}]}
          TAG="${RAND_ADJ}-${RAND_ANI}-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            App/backend/package-lock.json
            App/frontend/package-lock.json

      - name: Build and Test Backend
        run: |
          cd App/backend
          npm ci
          npm run lint
          # Build image for ARM64 (OCI Ampere)
          docker build --platform linux/arm64 -t ${{ secrets.DOCKERHUB_USERNAME }}/quiz-backend:${{ steps.generate-tag.outputs.tag }} .

      - name: Build and Test Frontend
        run: |
          cd App/frontend
          npm ci
          npm run lint
          
          # Use production/dev secrets for API URL
          API_URL="/graphql" # Proxied via Frontend Nginx
          SHOW_DEV_BAR="true"
          APP_ENV="${{ github.event.inputs.target_env }}"

          # Build production image for ARM64 (OCI Ampere)
          docker build \
            --platform linux/arm64 \
            --build-arg VITE_APP_VERSION=${{ steps.generate-tag.outputs.tag }} \
            --build-arg VITE_API_URL="$API_URL" \
            --build-arg VITE_SHOW_DEV_BAR="$SHOW_DEV_BAR" \
            --build-arg VITE_APP_ENV="$APP_ENV" \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/quiz-frontend:${{ steps.generate-tag.outputs.tag }} .

      - name: Push Images
        run: |
          # Push specific version tags
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/quiz-backend:${{ steps.generate-tag.outputs.tag }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/quiz-frontend:${{ steps.generate-tag.outputs.tag }}
          
          # ONLY update 'latest' if we are building for dev
          if [ "${{ github.event.inputs.target_env }}" == "dev" ]; then
            docker tag ${{ secrets.DOCKERHUB_USERNAME }}/quiz-backend:${{ steps.generate-tag.outputs.tag }} ${{ secrets.DOCKERHUB_USERNAME }}/quiz-backend:latest
            docker tag ${{ secrets.DOCKERHUB_USERNAME }}/quiz-frontend:${{ steps.generate-tag.outputs.tag }} ${{ secrets.DOCKERHUB_USERNAME }}/quiz-frontend:latest
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/quiz-backend:latest
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/quiz-frontend:latest
          fi

      - name: Update Kustomize Manifests
        run: |
          cd Infrastructure/kubernetes/apps/${{ github.event.inputs.target_env }}
          
          if [ "${{ github.event.inputs.target_env }}" == "prod" ]; then
            # Prod points to specific version
            kustomize edit set image villejuhan1/quiz-backend=${{ secrets.DOCKERHUB_USERNAME }}/quiz-backend:${{ steps.generate-tag.outputs.tag }}
            kustomize edit set image villejuhan1/quiz-frontend=${{ secrets.DOCKERHUB_USERNAME }}/quiz-frontend:${{ steps.generate-tag.outputs.tag }}
          else
            # Dev points to latest
            kustomize edit set image villejuhan1/quiz-backend=${{ secrets.DOCKERHUB_USERNAME }}/quiz-backend:latest
            kustomize edit set image villejuhan1/quiz-frontend=${{ secrets.DOCKERHUB_USERNAME }}/quiz-frontend:latest
            
            # Update the version label in the UI to match the generated tag
            sed -i "/name: VITE_APP_VERSION/{n;s/value: .*/value: ${{ steps.generate-tag.outputs.tag }}/}" kustomization.yaml
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Infrastructure/kubernetes/apps/${{ github.event.inputs.target_env }}/kustomization.yaml
          git commit -m "Deploy ${{ github.event.inputs.target_env }}: ${{ steps.generate-tag.outputs.tag }}"
          git push origin HEAD:${{ github.ref }}
