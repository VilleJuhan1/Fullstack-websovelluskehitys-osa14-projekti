name: Manual Branch Deploy

# Manual deployment workflow for the quiz application backend and frontend
on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

# Cancel previous deployments of the same workflow and target environment if there's a new deployment
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.target_env }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Use pseudo-random tag for image naming
      - name: Generate Random Tag
        id: generate-tag
        run: |
          ADJECTIVES=("happy" "brave" "clever" "swift" "obvious" "gentle" "mighty" "shiny")
          ANIMALS=("dolphin" "lion" "eagle" "fox" "whale" "owl" "tiger" "wolf")
          RAND_ADJ=${ADJECTIVES[$RANDOM % ${#ADJECTIVES[@]}]}
          RAND_ANI=${ANIMALS[$RANDOM % ${#ANIMALS[@]}]}
          TAG="${RAND_ADJ}-${RAND_ANI}-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      # Set up qemu and docker buildx for multi architecture builds as our environment is ARM64 based
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            App/backend/package-lock.json
            App/frontend/package-lock.json

      - name: Build and Push Backend
        id: build-backend
        run: |
          cd App/backend
          npm ci
          npm run lint
          npm audit --audit-level=high
          
          TAGS="-t ${{ secrets.DOCKERHUB_USERNAME }}/quiz-backend:${{ steps.generate-tag.outputs.tag }}"
          if [ "${{ github.event.inputs.target_env }}" == "dev" ]; then
            TAGS="$TAGS -t ${{ secrets.DOCKERHUB_USERNAME }}/quiz-backend:latest"
          fi
          
          # Build and push image for ARM64 (OCI Ampere) with full security attestations
          docker buildx build \
            --metadata-file metadata-backend.json \
            --platform linux/arm64 \
            --provenance=true \
            --sbom=true \
            --push $TAGS .

          BACKEND_DIGEST=$(jq -r '."containerimage.digest"' metadata-backend.json)
          echo "digest=$BACKEND_DIGEST" >> $GITHUB_OUTPUT

      - name: Build and Push Frontend
        id: build-frontend
        env:
          TARGET_ENV: ${{ github.event.inputs.target_env }}
          IMAGE_TAG: ${{ steps.generate-tag.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cd App/frontend
          npm ci
          npm run lint
          npm audit --audit-level=high

          # Use production/dev secrets for API URL
          API_URL="/graphql" # Proxied via Frontend Nginx
          APP_ENV="$TARGET_ENV"
          if [ "$APP_ENV" == "prod" ]; then
            SHOW_DEV_BAR="false"
          else
            SHOW_DEV_BAR="true"
          fi

          TAGS="-t $DOCKERHUB_USERNAME/quiz-frontend:$IMAGE_TAG"
          if [ "$APP_ENV" == "dev" ]; then
            TAGS="$TAGS -t $DOCKERHUB_USERNAME/quiz-frontend:latest"
          fi

          # Build the static files natively on the runner (extremely fast and avoids build-stage layers)
          VITE_APP_VERSION="$IMAGE_TAG" \
          VITE_API_URL="$API_URL" \
          VITE_SHOW_DEV_BAR="$SHOW_DEV_BAR" \
          VITE_APP_ENV="$APP_ENV" \
          VITE_LINKEDIN_URL="https://www.linkedin.com/in/ville-juhani-nivasalo/" \
          VITE_GITHUB_URL="https://github.com/VilleJuhan1" \
          npm run build

          # Build and push production image for ARM64 (OCI Ampere) with full security attestations
          docker buildx build \
            -f Dockerfile.prod \
            --metadata-file metadata-frontend.json \
            --platform linux/arm64 \
            --provenance=true \
            --sbom=true \
            --push $TAGS .

          FRONTEND_DIGEST=$(jq -r '."containerimage.digest"' metadata-frontend.json)
          echo "digest=$FRONTEND_DIGEST" >> $GITHUB_OUTPUT

      - name: Update Kustomize Manifests
        env:
          TARGET_ENV: ${{ github.event.inputs.target_env }}
          IMAGE_TAG: ${{ steps.generate-tag.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          BACKEND_DIGEST: ${{ steps.build-backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.build-frontend.outputs.digest }}
        run: |
          cd Infrastructure/kubernetes/apps/$TARGET_ENV
          kustomize edit set image villejuhan1/quiz-backend=$DOCKERHUB_USERNAME/quiz-backend@$BACKEND_DIGEST
          kustomize edit set image villejuhan1/quiz-frontend=$DOCKERHUB_USERNAME/quiz-frontend@$FRONTEND_DIGEST
          if [ "$TARGET_ENV" != "prod" ]; then
            # Update the version label in the UI to match the generated tag
            sed -i "/name: VITE_APP_VERSION/{n;s/value: .*/value: $IMAGE_TAG/}" kustomization.yaml
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Infrastructure/kubernetes/apps/${{ github.event.inputs.target_env }}/kustomization.yaml
          git commit -m "Deploy ${{ github.event.inputs.target_env }}: ${{ steps.generate-tag.outputs.tag }}"
          git push origin HEAD:${{ github.ref }}
