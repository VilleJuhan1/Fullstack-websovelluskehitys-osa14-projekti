name: Frontpage Deploy

# Manual deployment workflow for the landing page
on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

# Cancel previous deployments of the same workflow and target environment if there's a new deployment
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.target_env }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Random Tag for the image
        id: generate-tag
        run: |
          ADJECTIVES=("sandy" "digital" "cosmic" "playful" "stable" "future")
          ANIMALS=("robot" "droid" "bot" "crab" "cat" "sandbox")
          RAND_ADJ=${ADJECTIVES[$RANDOM % ${#ADJECTIVES[@]}]}
          RAND_ANI=${ANIMALS[$RANDOM % ${#ANIMALS[@]}]}
          TAG="front-${RAND_ADJ}-${RAND_ANI}-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      # Set up qemu and docker buildx for multi architecture builds as our environment is ARM64 based
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: App/frontpage/package-lock.json

      - name: Build and Push Frontpage
        env:
          TARGET_ENV: ${{ github.event.inputs.target_env }}
          IMAGE_TAG: ${{ steps.generate-tag.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VITE_GITHUB_URL: ${{ secrets.VITE_GITHUB_URL }}
          VITE_LINKEDIN_URL: ${{ secrets.VITE_LINKEDIN_URL }}
        run: |
          cd App/frontpage
          npm ci
          npm run lint

          TAGS="-t $DOCKERHUB_USERNAME/frontpage:$IMAGE_TAG"
          SHOW_DEV_BAR="false"
          if [ "$TARGET_ENV" == "dev" ]; then
            TAGS="$TAGS -t $DOCKERHUB_USERNAME/frontpage:latest"
            SHOW_DEV_BAR="true"
          fi

          # Build static files natively on the runner (Dockerfile.prod just COPYs dist)
          VITE_APP_VERSION="$IMAGE_TAG" \
          VITE_APP_ENV="$TARGET_ENV" \
          VITE_SHOW_DEV_BAR="$SHOW_DEV_BAR" \
          VITE_GITHUB_URL="$VITE_GITHUB_URL" \
          VITE_LINKEDIN_URL="$VITE_LINKEDIN_URL" \
          npm run build

          # Build and push production image for ARM64 (OCI Ampere) with full security attestations
          docker buildx build \
            -f Dockerfile.prod \
            --platform linux/arm64 \
            --provenance=true \
            --sbom=true \
            --push $TAGS .

      - name: Update Kustomize Manifests
        env:
          TARGET_ENV: ${{ github.event.inputs.target_env }}
          IMAGE_TAG: ${{ steps.generate-tag.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cd Infrastructure/kubernetes/apps/$TARGET_ENV
          kustomize edit set image villejuhan1/frontpage=$DOCKERHUB_USERNAME/frontpage:$IMAGE_TAG

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Infrastructure/kubernetes/apps/${{ github.event.inputs.target_env }}/kustomization.yaml
          git commit -m "Deploy Frontpage ${{ github.event.inputs.target_env }}: ${{ steps.generate-tag.outputs.tag }}"
          git push origin HEAD:${{ github.ref }}
