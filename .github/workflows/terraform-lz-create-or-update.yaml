name: Landing Zone creation via Terraform (only plan)

on:
  push:
    paths:
      - 'Infrastructure/terraform/landingZone/**'
      - '.github/workflows/terraform-lz-create-or-update.yaml'

# Simple workflow to test the terraform code changes in landingZone directory via GitHub Actions with terraform plan
# In a multi-developer environment would be the primary way to test and apply the landing zone changes
jobs:
  terraform:
    # Only run this job if the commit messages contain '#lz'
    if: contains(toJSON(github.event.commits.*.message), '#lz') 
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Infrastructure/terraform/landingZone
    env:
      # As this is Tenancy level configuration, we need to use tenancy admin level access
      TF_VAR_tenancy_ocid:      ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid:         ${{ secrets.OCI_LZ_USER_OCID }}
      TF_VAR_fingerprint:       ${{ secrets.OCI_LZ_FINGERPRINT }}
      TF_VAR_private_key:       ${{ secrets.OCI_LZ_PRIVATE_KEY }}
      TF_VAR_region:            ${{ secrets.OCI_LZ_REGION }}
      TF_VAR_projects:          ${{ secrets.OCI_LZ_PROJECTS }}
      TF_VAR_state_par_url:     ${{ secrets.OCI_LZ_STATE_PAR_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="address=${{ secrets.OCI_LZ_STATE_PAR_URL }}" \
            -backend-config="update_method=PUT"

      - name: Terraform Plan
        run: terraform plan