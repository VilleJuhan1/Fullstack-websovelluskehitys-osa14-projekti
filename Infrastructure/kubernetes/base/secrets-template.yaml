# Copy this file locally and fill the proper values for the dev/prod environment
# Then run: kubectl apply -f <your-local-file>.yaml -n <namespace>
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:
  # The connection string for the backend to find Postgres
  DATABASE_URL: "postgres://quizuser:quizpassword@postgres:5432/quizdb"
  # Variables for Postgres init
  POSTGRES_PASSWORD: "quizpassword"
  POSTGRES_USER: "quizuser"
  POSTGRES_DB: "quizdb"

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  # The secret key used to sign JWT tokens (e.g. from your .env)
  JWT_SECRET: "your-dev-jwt-secret-here"
  # The secret key used for hashing passwords (e.g. from your .env)
  PASSWORD_SECRET: "your-dev-password-secret-here"
