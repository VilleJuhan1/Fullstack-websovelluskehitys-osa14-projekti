apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: prod

commonLabels:
  env: prod

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_ENV
          value: production
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: VITE_APP_VERSION
          value: prod-latest
  - target:
      kind: Ingress
      name: quiz-ingress
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: quizgame.hiekkalaatikko.tech
      - op: replace
        path: /spec/rules/0/host
        value: quizgame.hiekkalaatikko.tech
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/valueFrom/secretKeyRef/name
        value: prod-db-secret
      - op: replace
        path: /spec/template/spec/containers/0/env/2/valueFrom/secretKeyRef/name
        value: prod-app-secret
      - op: replace
        path: /spec/template/spec/containers/0/env/3/valueFrom/secretKeyRef/name
        value: prod-app-secret
