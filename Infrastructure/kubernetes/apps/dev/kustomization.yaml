apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Patches the postgres/backend/frontend deployment for development environment in dev workspace and configures ingress for it
resources:
- ../../base

namespace: dev


patches:
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: backend
    spec:
      template:
        spec:
          containers:
            - name: backend
              env:
                - name: NODE_ENV
                  value: dev
              resources:
                limits:
                  cpu: 200m
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: frontend
    spec:
      template:
        spec:
          containers:
            - name: frontend
              env:
                - name: VITE_APP_VERSION
                  value: clever-wolf-3dc55a6
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: postgres
    spec:
      template:
        spec:
          containers:
            - name: postgres
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 256Mi
- patch: |-
    - op: replace
      path: /spec/tls/0/hosts/0
      value: dev.quizgame.hiekkalaatikko.tech
    - op: replace
      path: /spec/rules/0/host
      value: dev.quizgame.hiekkalaatikko.tech
  target:
    kind: Ingress
    name: quiz-ingress
- patch: |-
    - op: replace
      path: /spec/tls/0/hosts/0
      value: dev.hiekkalaatikko.tech
    - op: replace
      path: /spec/rules/0/host
      value: dev.hiekkalaatikko.tech
  target:
    kind: Ingress
    name: frontpage-ingress
images:
- name: villejuhan1/frontpage
  newName: villejuhan1/frontpage
  newTag: stable
- name: villejuhan1/quiz-backend
  newName: villejuhan1/quiz-backend
  newTag: clever-wolf-3dc55a6
- name: villejuhan1/quiz-frontend
  newName: villejuhan1/quiz-frontend
  newTag: clever-wolf-3dc55a6
labels:
- includeSelectors: true
  pairs:
    env: dev
