apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: dev

commonLabels:
  env: dev

patches:
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: NODE_ENV
        value: dev
  target:
    kind: Deployment
    name: backend
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: VITE_APP_VERSION
        value: brave-whale-43f0d5e
  target:
    kind: Deployment
    name: frontend
- patch: |-
    - op: replace
      path: /spec/tls/0/hosts/0
      value: dev.quizgame.hiekkalaatikko.tech
    - op: replace
      path: /spec/rules/0/host
      value: dev.quizgame.hiekkalaatikko.tech
  target:
    kind: Ingress
    name: quiz-ingress
images:
- name: villejuhan1/quiz-backend
  newName: villejuhan1/quiz-backend
  newTag: brave-whale-43f0d5e
- name: villejuhan1/quiz-frontend
  newName: villejuhan1/quiz-frontend
  newTag: brave-whale-43f0d5e
