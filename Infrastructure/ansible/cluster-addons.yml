---
- name: Install Kubernetes Add-ons (Ingress & Cert-Manager)
  hosts: master
  become: true
  vars_files:
    - vars.yml

  # Installs kubernetes python library and setups ingress and cert-manager for k3s
  tasks:
    - name: Prompt for email if not defined in vars.yml
      ansible.builtin.pause:
        prompt: "Enter email for Let's Encrypt certificates"
      register: email_input
      when: cert_manager_email is not defined

    - name: Set cert_manager_email fact from input
      ansible.builtin.set_fact:
        cert_manager_email: "{{ email_input.user_input }}"
      when: cert_manager_email is not defined

    - name: Install Python kubernetes library via apt
      ansible.builtin.apt:
        name: python3-kubernetes
        state: present
        update_cache: true

    - name: Create manifests directory
      ansible.builtin.file:
        path: /tmp/k8s-manifests
        state: directory

    - name: Apply Nginx Ingress Controller
      kubernetes.core.k8s:
        src: https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/cloud/deploy.yaml
        state: present
        kubeconfig: /etc/rancher/k3s/k3s.yaml

    # Refactor later into a manifest
    - name: Patch Ingress Service to use existing NLB ports
      kubernetes.core.k8s:
        state: patched
        kind: Service
        name: ingress-nginx-controller
        namespace: ingress-nginx
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        definition:
          spec:
            type: NodePort
            externalTrafficPolicy: Local
            ports:
              - name: http
                port: 80
                targetPort: http
                nodePort: 30080 # Only for testing, not needed after getting a domain and configuring DNS and TLS
              - name: https
                port: 443
                targetPort: https
                nodePort: 30443 # Listener is configured via terraform

    # Refactor later into a manifest
    - name: Patch Ingress Deployment for Multi-Node Scaling
      kubernetes.core.k8s:
        state: patched
        kind: Deployment
        name: ingress-nginx-controller
        namespace: ingress-nginx
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        definition:
          spec:
            replicas: 2
            template:
              spec:
                affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchExpressions:
                            - key: app.kubernetes.io/name
                              operator: In
                              values:
                                - ingress-nginx
                            - key: app.kubernetes.io/component
                              operator: In
                              values:
                                - controller
                        topologyKey: kubernetes.io/hostname


    - name: Apply Cert-Manager
      kubernetes.core.k8s:
        src: https://github.com/cert-manager/cert-manager/releases/download/v1.20.2/cert-manager.yaml
        state: present
        kubeconfig: /etc/rancher/k3s/k3s.yaml

    - name: Wait for Cert-Manager to be ready
      ansible.builtin.pause:
        seconds: 30

    - name: Generate ClusterIssuer from template
      ansible.builtin.template:
        src: templates/cluster-issuer.yaml.j2
        dest: /tmp/k8s-manifests/cluster-issuer.yaml

    - name: Apply ClusterIssuer
      kubernetes.core.k8s:
        state: present
        src: /tmp/k8s-manifests/cluster-issuer.yaml
        kubeconfig: /etc/rancher/k3s/k3s.yaml

    - name: Add External Secrets Operator Helm Repository
      kubernetes.core.helm_repository:
        name: external-secrets
        repo_url: https://charts.external-secrets.io

    - name: Deploy External Secrets Operator
      kubernetes.core.helm:
        name: external-secrets
        chart_ref: external-secrets/external-secrets
        release_namespace: external-secrets
        create_namespace: true
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        state: present
        values:
          installCRDs: true

    - name: Wait for External Secrets Operator deployment to be ready
      ansible.builtin.shell: |
        kubectl rollout status deployment/external-secrets -n external-secrets --kubeconfig /etc/rancher/k3s/k3s.yaml

    - name: Ensure target namespaces exist
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ item }}"
        state: present
        kubeconfig: /etc/rancher/k3s/k3s.yaml
      with_items:
        - dev
        - prod
      when: vault_ocid is defined and vault_ocid != ''

    - name: Generate SecretStore manifests from template
      ansible.builtin.template:
        src: templates/secret-store.yaml.j2
        dest: "/tmp/k8s-manifests/secret-store-{{ item }}.yaml"
      with_items:
        - dev
        - prod
      when: vault_ocid is defined and vault_ocid != ''

    - name: Wait for SecretStore CRD to be established
      ansible.builtin.shell: |
        kubectl wait --for=condition=established --timeout=60s crd/secretstores.external-secrets.io --kubeconfig /etc/rancher/k3s/k3s.yaml
      when: vault_ocid is defined and vault_ocid != ''

    - name: Apply SecretStore manifests
      ansible.builtin.shell: |
        kubectl apply -f /tmp/k8s-manifests/secret-store-{{ item }}.yaml --kubeconfig /etc/rancher/k3s/k3s.yaml
      with_items:
        - dev
        - prod
      when: vault_ocid is defined and vault_ocid != ''
      register: apply_result
      until: apply_result.rc == 0
      retries: 5
      delay: 5
