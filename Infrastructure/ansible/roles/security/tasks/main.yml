---
# Host Hardening Tasks

# 1. SSH Hardening (via drop-in file to avoid modifying system defaults)
- name: Ensure sshd_config.d directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: "0755"

- name: Create SSH hardening override file
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-ansible-hardening.conf
    mode: "0644"
    content: |
      # Managed by Ansible - Host Hardening
      PasswordAuthentication no
      PermitRootLogin no
      MaxAuthTries 3
      PubkeyAuthentication yes
  notify: Restart SSH

- name: Ensure main sshd_config includes the .d directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    state: present
  notify: Restart SSH

# 2. Automatic security updates for the OS
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# 2.1. Disable legacy iptables rules so that UFW can manage the firewall
- name: Check if K3s is already installed (to avoid re-purging iptables)
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_installed_check

- name: Purge legacy OCI iptables rules (prevents 'admin prohibited' errors), only run if k3s is not installed or if force_reinstall is set
  ansible.builtin.shell: |
    iptables -F
    iptables -X
    iptables -t nat -F
    iptables -t nat -X
    iptables -P INPUT ACCEPT
    iptables -P FORWARD ACCEPT
    iptables -P OUTPUT ACCEPT
  become: true
  ignore_errors: true
  when: >
    (not k3s_installed_check.stat.exists) or
    (force_reinstall | default(false) | bool)

# 3. Fail2Ban for another layer of security even though we're blocking ingress already
- name: Install Fail2Ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Ensure Fail2Ban is started and enabled
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true

# 4. Kernel hardening, just in case
- name: Disable ICMP redirects (prevents MITM)
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.accept_redirects
    value: "0"
    state: present
    reload: true

# 5. Firewall management to account for K3s and Bastion SSH
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH in UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow KubeAPI (6443) in UFW
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp

- name: Allow Kubernetes NodePort range in UFW
  community.general.ufw:
    rule: allow
    port: 30000:32767
    proto: tcp

- name: Allow all traffic from the VCN CIDR, a blanket rule for internal traffic which relies on the NSG-layer to handle the actual security
  community.general.ufw:
    rule: allow
    src: "10.0.0.0/16"

- name: Allow K3s Pod CIDR
  community.general.ufw:
    rule: allow
    src: "10.42.0.0/16"

- name: Allow K3s Service CIDR
  community.general.ufw:
    rule: allow
    src: "10.43.0.0/16"

- name: Set UFW default forward policy to ACCEPT (Required by K3s)
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: "^DEFAULT_FORWARD_POLICY="
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'

- name: Enable UFW and set default deny policy
  community.general.ufw:
    state: enabled
    policy: deny
