---
- name: Configure Common OS Settings
  hosts: k3s_cluster
  become: true
  roles:
    - common
    - security

- name: Configure Master Node
  hosts: k3s_master
  become: true
  roles:
    - k3s_master

- name: Configure Storage and Worker Node
  hosts: k3s_worker
  become: true
  roles:
    - storage
    - k3s_worker

- name: Configure cluster addons and monitoring
  hosts: k3s_master
  become: true
  vars_files:
    - vars.yml
  roles:
    - monitoring
    - argocd
