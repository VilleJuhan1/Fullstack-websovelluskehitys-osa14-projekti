# Docker-compose file for the backend and PostgreSQL (DEVELOPMENT!)

services:
  # connect to the postgres container while dev with `docker exec -it local_dev_db psql -U admin -d mydatabase`
  postgres:
    image: postgres:18-alpine
    container_name: local_dev_db
    restart: always
    # use secrets for environment variables in production! these are only for dev
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=mydatabase
    ports:
      - '5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5
  graphql-api:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: ../../App/backend
      dockerfile: Dockerfile
    container_name: graphql-api
    restart: always
    # these secrets are only for dev, use secrets from vault in the build in production (Also CI/CD)
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=mydatabase
      - POSTGRES_PORT=5432
      - PASSWORD_SECRET=test-environment-super-secret-key
      - JWT_SECRET=super-secure-test-jwt-secret
      #- NODE_ENV=development #overwrites the default 'production' in the dockerfile
    ports:
      - '4000:4000'