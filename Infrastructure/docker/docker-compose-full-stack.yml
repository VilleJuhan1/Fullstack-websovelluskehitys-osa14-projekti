# Docker-compose file for the backend and PostgreSQL

services:
  # connect to the postgres container while dev with `docker exec -it local_dev_db psql -U admin -d mydatabase`
  postgres:
    image: postgres:18-alpine
    container_name: local_dev_db
    restart: always
    # only for dev and as an example, use proper secrets management in production
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=mydatabase
    ports:
      - '5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5
  graphql-api:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: ../../App/backend
      dockerfile: Dockerfile
    container_name: graphql-api
    restart: always
    # only for dev and as an example, use proper secrets management in production
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=mydatabase
      - POSTGRES_PORT=5432
    ports:
      - '4000:4000'
  frontend:
    depends_on:
      - graphql-api
    build:
      context: ../../App/frontend
      args:
        VITE_GRAPHQL_URI: http://localhost:4000/
    ports:
      - '8080:80'